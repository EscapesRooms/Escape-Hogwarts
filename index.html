<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ Búsqueda de los Horrocrux ⚡</title>

// Tipografia especifica Harry Potter
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

  <div id="bg" class="fondo"></div>
  
  <audio id="music" loop>
    <source src="./music.mp3" type="audio/mpeg">
  </audio>
  
  <button id="musicBtn" class="boton-musica">
    🎵 Activar / Desactivar Música
  </button>
  
  <div class="contenedor">
  
  <img src="hogwarts.png" class="logo">
  
  <h1>⚡ Búsqueda de los Horrocruxes ⚡</h1>
  
  <p class="intro">
  El Ministerio de Magia necesita tu ayuda.
  Resuelve los enigmas y encuentra el siguiente rastro antes de que las fuerzas oscuras lo hagan.
  </p>
  
  <h2 id="localizacion"></h2>
  
  <p id="pregunta"></p>
  
  <div id="respuestas"></div>
  
  <div id="resultado"></div>
  
  <div class="footer">
  🏰 Hogwarts School of Witchcraft and Wizardry 🏰
  </div>
  
  </div>
  <script src="js/game-final.js"></script>

</html>
